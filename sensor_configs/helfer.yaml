# --- Template Sensoren (Berechnungen) ---

template:
  - sensor:
      # reine PV AC Leistung des Wechselrichters
      - name: "Solis PV Leistung Netto"
        unique_id: solis_pv_power_netto
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {% set ac = states('sensor.solis_raw_pv_ac_power') | float(0) %}
          {% set batt = states('sensor.solis_raw_batt_p') | float(0) %}
          {{ ac - batt | round(0) }}

      - name: "WR Leistung"
        unique_id: solis_inverter_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >
          {% set dc = states('sensor.solis_raw_pv_dc_power') | float(0) %}
          {% set ac = states('sensor.solis_raw_pv_ac_power') | float(0) %}
          {% set batt = states('sensor.solis_raw_batt_p') | float(0) %}
          {{ (ac - dc - batt) | abs | round(1) }}

      - name: "Solis WR Wirkungsgrad"
        unique_id: solis_inverter_efficiency
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-outline
        state: >
          {% set dc = states('sensor.solis_raw_pv_dc_power') | float(0) %}
          {% set ac_netto = states('sensor.solis_pv_leistung_netto') | float(0) %}
          {% if dc > 100 %}
            {{ ((ac_netto / dc) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
