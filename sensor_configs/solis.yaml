# Solis inverter values, derived from the raw states set by pyscript.
# Every sensor carries an is_number availability guard: while a raw source is
# missing after a restart the sensor reports "unavailable" instead of 0, so
# energy counters see no reset spike and measurement graphs show a clean gap.

template:
  - sensor:

      # --- PV yield history ---
      - name: "Solis PV Ertrag Gesamt"
        unique_id: solis_pv_total_yield
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        availability: "{{ is_number(states('sensor.solis_raw_pv_total_yield')) }}"
        state: "{{ states('sensor.solis_raw_pv_total_yield') | float(0) }}"

      - name: "Solis PV Ertrag Jahr"
        unique_id: solis_pv_year_yield
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:calendar-range
        availability: "{{ is_number(states('sensor.solis_raw_pv_year_yield')) }}"
        state: "{{ states('sensor.solis_raw_pv_year_yield') | float(0) }}"

      - name: "Solis PV Ertrag Monat"
        unique_id: solis_pv_month_yield
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:calendar-month
        availability: "{{ is_number(states('sensor.solis_raw_pv_month_yield')) }}"
        state: "{{ states('sensor.solis_raw_pv_month_yield') | float(0) }}"

      - name: "Solis PV Ertrag Heute"
        unique_id: solis_pv_today_yield
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:calendar-today
        availability: "{{ is_number(states('sensor.solis_raw_pv_today_yield')) }}"
        state: "{{ states('sensor.solis_raw_pv_today_yield') | float(0) }}"

      # --- Current PV power ---
      - name: "Solis PV Leistung DC (Gesamt)"
        unique_id: solis_pv_dc_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
        availability: "{{ is_number(states('sensor.solis_raw_pv_dc_power')) }}"
        state: "{{ states('sensor.solis_raw_pv_dc_power') | float(0) }}"

      - name: "Solis WR Leistung AC"
        unique_id: solis_pv_ac_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        availability: "{{ is_number(states('sensor.solis_raw_pv_ac_power')) }}"
        state: "{{ states('sensor.solis_raw_pv_ac_power') | float(0) }}"

      # --- String power ---
      - name: "Solis PV String 1 Leistung"
        unique_id: solis_pv_p1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel-large
        availability: "{{ is_number(states('sensor.solis_raw_pv_p1')) }}"
        state: "{{ states('sensor.solis_raw_pv_p1') | float(0) }}"

      - name: "Solis PV String 2 Leistung"
        unique_id: solis_pv_p2
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel-large
        availability: "{{ is_number(states('sensor.solis_raw_pv_p2')) }}"
        state: "{{ states('sensor.solis_raw_pv_p2') | float(0) }}"

      - name: "Solis PV String 3 Leistung"
        unique_id: solis_pv_p3
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel-large
        availability: "{{ is_number(states('sensor.solis_raw_pv_p3')) }}"
        state: "{{ states('sensor.solis_raw_pv_p3') | float(0) }}"

      - name: "Solis PV String 4 Leistung"
        unique_id: solis_pv_p4
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel-large
        availability: "{{ is_number(states('sensor.solis_raw_pv_p4')) }}"
        state: "{{ states('sensor.solis_raw_pv_p4') | float(0) }}"

      # --- Grid ---
      - name: "Solis Netzleistung aktuell"
        unique_id: solis_grid_power_now
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower
        # - = export | + = import
        availability: "{{ is_number(states('sensor.solis_raw_grid_power')) }}"
        state: "{{ states('sensor.solis_raw_grid_power') | float(0) }}"

      - name: "Solis Netzbezug gesamt"
        unique_id: solis_grid_import_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-import
        availability: "{{ is_number(states('sensor.solis_raw_grid_import_total')) }}"
        state: "{{ states('sensor.solis_raw_grid_import_total') | float(0) }}"

      - name: "Solis Netzeinspeisung gesamt"
        unique_id: solis_grid_export_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-export
        availability: "{{ is_number(states('sensor.solis_raw_grid_export_total')) }}"
        state: "{{ states('sensor.solis_raw_grid_export_total') | float(0) }}"

      - name: "Solis Netzbezug heute"
        unique_id: solis_grid_import_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-import
        availability: "{{ is_number(states('sensor.solis_raw_grid_import_today')) }}"
        state: "{{ states('sensor.solis_raw_grid_import_today') | float(0) }}"

      - name: "Solis Netzeinspeisung heute"
        unique_id: solis_grid_export_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-export
        availability: "{{ is_number(states('sensor.solis_raw_grid_export_today')) }}"
        state: "{{ states('sensor.solis_raw_grid_export_today') | float(0) }}"

      # --- House load ---
      - name: "Hausverbrauch"
        unique_id: solis_house_load
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt
        availability: "{{ is_number(states('sensor.solis_raw_house_load')) }}"
        state: "{{ states('sensor.solis_raw_house_load') | float(0) }}"

      - name: "Solis Hausverbrauch gesamt"
        unique_id: solis_house_yield_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:home-import-outline
        availability: "{{ is_number(states('sensor.solis_raw_house_total')) }}"
        state: "{{ states('sensor.solis_raw_house_total') | float(0) }}"

      - name: "Solis Hausverbrauch heute"
        unique_id: solis_house_yield_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:home-clock-outline
        availability: "{{ is_number(states('sensor.solis_raw_house_today')) }}"
        state: "{{ states('sensor.solis_raw_house_today') | float(0) }}"

      # --- Inverter temperature ---
      - name: "Solis Wechselrichter Temperatur"
        unique_id: solis_wr_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer
        availability: "{{ is_number(states('sensor.solis_raw_wr_temperature')) }}"
        state: "{{ states('sensor.solis_raw_wr_temperature') | float(0) }}"

      # --- Backup / EPS port: direct values ---
      - name: "Solis Backup Spannung L1"
        unique_id: solis_backup_v_l1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.solis_raw_backup_v_l1')) }}"
        state: "{{ states('sensor.solis_raw_backup_v_l1') | float(0) }}"

      - name: "Solis Backup Spannung L2"
        unique_id: solis_backup_v_l2
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.solis_raw_backup_v_l2')) }}"
        state: "{{ states('sensor.solis_raw_backup_v_l2') | float(0) }}"

      - name: "Solis Backup Spannung L3"
        unique_id: solis_backup_v_l3
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.solis_raw_backup_v_l3')) }}"
        state: "{{ states('sensor.solis_raw_backup_v_l3') | float(0) }}"

      - name: "Solis Backup Strom L1"
        unique_id: solis_backup_i_l1
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: "{{ is_number(states('sensor.solis_raw_backup_i_l1')) }}"
        state: "{{ states('sensor.solis_raw_backup_i_l1') | float(0) }}"

      - name: "Solis Backup Strom L2"
        unique_id: solis_backup_i_l2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: "{{ is_number(states('sensor.solis_raw_backup_i_l2')) }}"
        state: "{{ states('sensor.solis_raw_backup_i_l2') | float(0) }}"

      - name: "Solis Backup Strom L3"
        unique_id: solis_backup_i_l3
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: "{{ is_number(states('sensor.solis_raw_backup_i_l3')) }}"
        state: "{{ states('sensor.solis_raw_backup_i_l3') | float(0) }}"

      - name: "Solis Backup Leistung"
        unique_id: solis_backup_load
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-battery
        availability: "{{ is_number(states('sensor.solis_raw_backup_load')) }}"
        state: "{{ states('sensor.solis_raw_backup_load') | float(0) }}"

      # --- Backup active power per phase (scaled to register 33148) ---
      - name: "Solis Backup Wirkleistung L1"
        unique_id: solis_backup_power_l1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt-outline
        availability: "{{ is_number(states('sensor.solis_raw_backup_power_l1')) }}"
        state: "{{ states('sensor.solis_raw_backup_power_l1') | float(0) }}"

      - name: "Solis Backup Wirkleistung L2"
        unique_id: solis_backup_power_l2
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt-outline
        availability: "{{ is_number(states('sensor.solis_raw_backup_power_l2')) }}"
        state: "{{ states('sensor.solis_raw_backup_power_l2') | float(0) }}"

      - name: "Solis Backup Wirkleistung L3"
        unique_id: solis_backup_power_l3
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt-outline
        availability: "{{ is_number(states('sensor.solis_raw_backup_power_l3')) }}"
        state: "{{ states('sensor.solis_raw_backup_power_l3') | float(0) }}"

      # --- Backup energy (only when registers 33590/33596 are present) ---
      # The guard also covers the case where chunk D is missing entirely.
      - name: "Solis Backup Energie gesamt"
        unique_id: solis_backup_energy_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:home-battery-outline
        availability: "{{ is_number(states('sensor.solis_raw_backup_energy_total')) }}"
        state: "{{ states('sensor.solis_raw_backup_energy_total') | float(0) }}"

      - name: "Solis Backup Energie heute"
        unique_id: solis_backup_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:home-battery-outline
        availability: "{{ is_number(states('sensor.solis_raw_backup_energy_today')) }}"
        state: "{{ states('sensor.solis_raw_backup_energy_today') | float(0) }}"
