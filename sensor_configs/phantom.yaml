template:
  - sensor:
      # === EXPORT PLAUSIBILITÄT ===
      
      - name: "Netz Export Plausibel"
        unique_id: grid_export_plausible
        state: "{{ 'true' if states('sensor.phantom_raw_export_plausible') | int(0) == 1 else 'false' }}"
        icon: "{{ 'mdi:check-circle' if states('sensor.phantom_raw_export_plausible') | int(0) == 1 else 'mdi:alert-circle' }}"
        attributes:
          grund: "{{ states('sensor.phantom_raw_export_grund') }}"
      
      # === IMPORT PLAUSIBILITÄT ===
      
      - name: "Netz Import Plausibel"
        unique_id: grid_import_plausible
        state: "{{ 'true' if states('sensor.phantom_raw_import_plausible') | int(0) == 1 else 'false' }}"
        icon: "{{ 'mdi:check-circle' if states('sensor.phantom_raw_import_plausible') | int(0) == 1 else 'mdi:alert-circle' }}"
        attributes:
          grund: "{{ states('sensor.phantom_raw_import_grund') }}"
      
      # === PHANTOM POWER AKTUELL ===
      
      - name: "Phantom Power Aktuell"
        unique_id: phantom_power_now
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:ghost
        state: "{{ states('sensor.phantom_raw_power_now') | float(0) }}"
