# Eastron SDM630 values, derived from the raw states set by the sniffer
# pyscript. Every sensor carries an is_number availability guard: while a raw
# source is missing after a restart the sensor reports "unavailable" instead
# of 0, so energy counters see no reset spike and measurement graphs show a
# clean gap.

template:
  - sensor:

      # --- L-N voltages (3x avg, 3x min) ---
      - name: "Netzspannung L1"
        unique_id: eastron_u1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_u1')) }}"
        state: "{{ states('sensor.eastron_raw_u1') | float(0) | round(2) }}"

      - name: "Netzspannung L1 Min"
        unique_id: eastron_u1_min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: "{{ is_number(states('sensor.eastron_raw_u1_min')) }}"
        state: "{{ states('sensor.eastron_raw_u1_min') | float(0) | round(2) }}"

      - name: "Netzspannung L2"
        unique_id: eastron_u2
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_u2')) }}"
        state: "{{ states('sensor.eastron_raw_u2') | float(0) | round(2) }}"

      - name: "Netzspannung L2 Min"
        unique_id: eastron_u2_min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: "{{ is_number(states('sensor.eastron_raw_u2_min')) }}"
        state: "{{ states('sensor.eastron_raw_u2_min') | float(0) | round(2) }}"

      - name: "Netzspannung L3"
        unique_id: eastron_u3
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_u3')) }}"
        state: "{{ states('sensor.eastron_raw_u3') | float(0) | round(2) }}"

      - name: "Netzspannung L3 Min"
        unique_id: eastron_u3_min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: "{{ is_number(states('sensor.eastron_raw_u3_min')) }}"
        state: "{{ states('sensor.eastron_raw_u3_min') | float(0) | round(2) }}"

      # --- L-L voltages (3x avg, 3x min) ---
      # Line-to-line voltages ignore the neutral. If they stay symmetric while
      # L-N drifts apart, the cause is in the star point, not the supply.
      - name: "Netzspannung L1-L2"
        unique_id: eastron_u12
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-triangle
        availability: "{{ is_number(states('sensor.eastron_raw_u12')) }}"
        state: "{{ states('sensor.eastron_raw_u12') | float(0) | round(2) }}"

      - name: "Netzspannung L1-L2 Min"
        unique_id: eastron_u12_min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: "{{ is_number(states('sensor.eastron_raw_u12_min')) }}"
        state: "{{ states('sensor.eastron_raw_u12_min') | float(0) | round(2) }}"

      - name: "Netzspannung L2-L3"
        unique_id: eastron_u23
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-triangle
        availability: "{{ is_number(states('sensor.eastron_raw_u23')) }}"
        state: "{{ states('sensor.eastron_raw_u23') | float(0) | round(2) }}"

      - name: "Netzspannung L2-L3 Min"
        unique_id: eastron_u23_min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: "{{ is_number(states('sensor.eastron_raw_u23_min')) }}"
        state: "{{ states('sensor.eastron_raw_u23_min') | float(0) | round(2) }}"

      - name: "Netzspannung L3-L1"
        unique_id: eastron_u31
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-triangle
        availability: "{{ is_number(states('sensor.eastron_raw_u31')) }}"
        state: "{{ states('sensor.eastron_raw_u31') | float(0) | round(2) }}"

      - name: "Netzspannung L3-L1 Min"
        unique_id: eastron_u31_min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-down-bold
        availability: "{{ is_number(states('sensor.eastron_raw_u31_min')) }}"
        state: "{{ states('sensor.eastron_raw_u31_min') | float(0) | round(2) }}"

      # --- Voltage spread (2x avg, 2x max) ---
      # Each spread is formed within a single response frame, so the three
      # compared voltages share one snapshot. L-N and L-L come from different
      # frames and must not be combined.
      - name: "Spannungsspreizung L-N"
        unique_id: eastron_spread_ln
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-expand-vertical
        availability: "{{ is_number(states('sensor.eastron_raw_spread_ln')) }}"
        state: "{{ states('sensor.eastron_raw_spread_ln') | float(0) | round(2) }}"

      - name: "Spannungsspreizung L-N Max"
        unique_id: eastron_spread_ln_max
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-up-bold
        availability: "{{ is_number(states('sensor.eastron_raw_spread_ln_max')) }}"
        state: "{{ states('sensor.eastron_raw_spread_ln_max') | float(0) | round(2) }}"

      - name: "Spannungsspreizung L-L"
        unique_id: eastron_spread_ll
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-expand-vertical
        availability: "{{ is_number(states('sensor.eastron_raw_spread_ll')) }}"
        state: "{{ states('sensor.eastron_raw_spread_ll') | float(0) | round(2) }}"

      - name: "Spannungsspreizung L-L Max"
        unique_id: eastron_spread_ll_max
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:arrow-up-bold
        availability: "{{ is_number(states('sensor.eastron_raw_spread_ll_max')) }}"
        state: "{{ states('sensor.eastron_raw_spread_ll_max') | float(0) | round(2) }}"

      # --- Symmetrical components (2x) ---
      # Star-point shift: distance of the measured neutral from the centroid of
      # the voltage triangle, i.e. the zero sequence in volts. Grows with
      # unbalanced load across the neutral-path impedance. Negative sequence:
      # unbalance of the supply itself, independent of the neutral. EN 50160
      # sets 2 % as the limit for the 95 % value of the weekly measurement.
      - name: "Sternpunktverschiebung"
        unique_id: eastron_v0
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-point
        availability: "{{ is_number(states('sensor.eastron_raw_v0')) }}"
        state: "{{ states('sensor.eastron_raw_v0') | float(0) | round(2) }}"
        # Carry resid from the raw sensor so it survives the recorder exclusion
        # of eastron_raw_* (filter for disturbed cycles, >0.8 V).
        attributes:
          resid: "{{ state_attr('sensor.eastron_raw_v0', 'resid') }}"

      # Phantom status as its own template so the info survives the recorder
      # exclusion of eastron_raw_*. Deliberately without net_avg/net_avg_n: the
      # sliding mean is reconstructed offline from p1/p2/p3, not logged.
      - name: "Phantom Aktiv"
        unique_id: eastron_phantom_active
        icon: mdi:ghost
        state: "{{ states('sensor.eastron_raw_phantom_active') }}"

      # Projection of the star-point shift onto the three phase axes. Positive =
      # this phase is raised by the shift, negative = lowered. Isolates the
      # zero-sequence part (unlike "phase voltage minus mean", which also holds
      # the negative sequence). Raw states from star_point_vector() since
      # sniffer 5.10.0.
      - name: "Sternpunkt Projektion L1"
        unique_id: eastron_v0_l1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-line
        availability: "{{ is_number(states('sensor.eastron_raw_v0_l1')) }}"
        state: "{{ states('sensor.eastron_raw_v0_l1') | float(0) | round(2) }}"

      - name: "Sternpunkt Projektion L2"
        unique_id: eastron_v0_l2
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-line
        availability: "{{ is_number(states('sensor.eastron_raw_v0_l2')) }}"
        state: "{{ states('sensor.eastron_raw_v0_l2') | float(0) | round(2) }}"

      - name: "Sternpunkt Projektion L3"
        unique_id: eastron_v0_l3
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-line
        availability: "{{ is_number(states('sensor.eastron_raw_v0_l3')) }}"
        state: "{{ states('sensor.eastron_raw_v0_l3') | float(0) | round(2) }}"

      - name: "Gegensystem Unsymmetrie"
        unique_id: eastron_u2_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:scale-unbalanced
        availability: "{{ is_number(states('sensor.eastron_raw_u2_pct')) }}"
        state: "{{ states('sensor.eastron_raw_u2_pct') | float(0) | round(2) }}"

      # --- Grid frequency (1x) ---
      # Register 70, only present when the inverter reads a block covering it.
      # Deliberately no 10-minute mean: IEC 61000-4-30 derives frequency from
      # period counting over 10 s, not from averages.
      - name: "Netzfrequenz"
        unique_id: eastron_freq
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_freq')) }}"
        state: "{{ states('sensor.eastron_raw_freq') | float(0) | round(3) }}"

      # --- 10-minute means per EN 50160 (8x) ---
      # Fixed consecutive 10-minute blocks, RMS-averaged in the script. Basis
      # for the 95 % evaluation of the weekly measurement: voltage 230 V
      # +10 %/-10 %, negative sequence 2 %. The samples attribute shows how many
      # values the block is based on.
      - name: "Netzspannung L1 10min"
        unique_id: eastron_u1_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: "{{ is_number(states('sensor.eastron_10min_u1')) }}"
        state: "{{ states('sensor.eastron_10min_u1') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u1', 'samples') }}"

      - name: "Netzspannung L2 10min"
        unique_id: eastron_u2_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: "{{ is_number(states('sensor.eastron_10min_u2')) }}"
        state: "{{ states('sensor.eastron_10min_u2') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u2', 'samples') }}"

      - name: "Netzspannung L3 10min"
        unique_id: eastron_u3_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: "{{ is_number(states('sensor.eastron_10min_u3')) }}"
        state: "{{ states('sensor.eastron_10min_u3') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u3', 'samples') }}"

      - name: "Netzspannung L1-L2 10min"
        unique_id: eastron_u12_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: "{{ is_number(states('sensor.eastron_10min_u12')) }}"
        state: "{{ states('sensor.eastron_10min_u12') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u12', 'samples') }}"

      - name: "Netzspannung L2-L3 10min"
        unique_id: eastron_u23_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: "{{ is_number(states('sensor.eastron_10min_u23')) }}"
        state: "{{ states('sensor.eastron_10min_u23') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u23', 'samples') }}"

      - name: "Netzspannung L3-L1 10min"
        unique_id: eastron_u31_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:chart-timeline-variant
        availability: "{{ is_number(states('sensor.eastron_10min_u31')) }}"
        state: "{{ states('sensor.eastron_10min_u31') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u31', 'samples') }}"

      - name: "Sternpunktverschiebung 10min"
        unique_id: eastron_v0_10min
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:vector-point
        availability: "{{ is_number(states('sensor.eastron_10min_v0')) }}"
        state: "{{ states('sensor.eastron_10min_v0') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_v0', 'samples') }}"

      - name: "Gegensystem Unsymmetrie 10min"
        unique_id: eastron_u2_percent_10min
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:scale-unbalanced
        availability: "{{ is_number(states('sensor.eastron_10min_u2_pct')) }}"
        state: "{{ states('sensor.eastron_10min_u2_pct') | float(0) | round(2) }}"
        attributes:
          samples: "{{ state_attr('sensor.eastron_10min_u2_pct', 'samples') }}"

      # --- Currents (3x avg, 3x max) ---
      - name: "Netzstrom L1"
        unique_id: eastron_i1
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: "{{ is_number(states('sensor.eastron_raw_i1')) }}"
        state: "{{ states('sensor.eastron_raw_i1') | float(0) | round(2) }}"

      - name: "Netzstrom L1 Max"
        unique_id: eastron_i1_max
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:arrow-up-bold
        availability: "{{ is_number(states('sensor.eastron_raw_i1_max')) }}"
        state: "{{ states('sensor.eastron_raw_i1_max') | float(0) | round(2) }}"

      - name: "Netzstrom L2"
        unique_id: eastron_i2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: "{{ is_number(states('sensor.eastron_raw_i2')) }}"
        state: "{{ states('sensor.eastron_raw_i2') | float(0) | round(2) }}"

      - name: "Netzstrom L2 Max"
        unique_id: eastron_i2_max
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:arrow-up-bold
        availability: "{{ is_number(states('sensor.eastron_raw_i2_max')) }}"
        state: "{{ states('sensor.eastron_raw_i2_max') | float(0) | round(2) }}"

      - name: "Netzstrom L3"
        unique_id: eastron_i3
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: "{{ is_number(states('sensor.eastron_raw_i3')) }}"
        state: "{{ states('sensor.eastron_raw_i3') | float(0) | round(2) }}"

      - name: "Netzstrom L3 Max"
        unique_id: eastron_i3_max
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:arrow-up-bold
        availability: "{{ is_number(states('sensor.eastron_raw_i3_max')) }}"
        state: "{{ states('sensor.eastron_raw_i3_max') | float(0) | round(2) }}"

      # --- Power (3x phase, 1x total) ---
      # The script already flips the sign: negative = export, positive = import.
      - name: "Netzleistung L1"
        unique_id: eastron_p1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        availability: "{{ is_number(states('sensor.eastron_raw_p1')) }}"
        state: "{{ states('sensor.eastron_raw_p1') | float(0) | round(1) }}"

      - name: "Netzleistung L2"
        unique_id: eastron_p2
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        availability: "{{ is_number(states('sensor.eastron_raw_p2')) }}"
        state: "{{ states('sensor.eastron_raw_p2') | float(0) | round(1) }}"

      - name: "Netzleistung L3"
        unique_id: eastron_p3
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        availability: "{{ is_number(states('sensor.eastron_raw_p3')) }}"
        state: "{{ states('sensor.eastron_raw_p3') | float(0) | round(1) }}"

      - name: "Netzleistung Gesamt"
        unique_id: eastron_p_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-import-export
        availability: "{{ is_number(states('sensor.eastron_raw_p_tot')) }}"
        state: "{{ states('sensor.eastron_raw_p_tot') | float(0) | round(1) }}"

      # --- Reactive / apparent power and power factor (11x) ---
      # Reactive power is the second degree of freedom in the voltage drop
      # dU = (R*P + X*Q) / U and lets the resistive and reactive parts of the
      # feeder be estimated separately. Sign as for active power: negative =
      # export. Apparent power is a magnitude and stays positive; its
      # difference to sqrt(P^2+Q^2) is the distortion power, an indicator for
      # current harmonics.
      - name: "Blindleistung L1"
        unique_id: eastron_q1
        unit_of_measurement: "var"
        device_class: reactive_power
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_q1')) }}"
        state: "{{ states('sensor.eastron_raw_q1') | float(0) | round(1) }}"

      - name: "Blindleistung L2"
        unique_id: eastron_q2
        unit_of_measurement: "var"
        device_class: reactive_power
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_q2')) }}"
        state: "{{ states('sensor.eastron_raw_q2') | float(0) | round(1) }}"

      - name: "Blindleistung L3"
        unique_id: eastron_q3
        unit_of_measurement: "var"
        device_class: reactive_power
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_q3')) }}"
        state: "{{ states('sensor.eastron_raw_q3') | float(0) | round(1) }}"

      - name: "Blindleistung Gesamt"
        unique_id: eastron_q_total
        unit_of_measurement: "var"
        device_class: reactive_power
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ is_number(states('sensor.eastron_raw_q_tot')) }}"
        state: "{{ states('sensor.eastron_raw_q_tot') | float(0) | round(1) }}"

      - name: "Scheinleistung L1"
        unique_id: eastron_va1
        unit_of_measurement: "VA"
        device_class: apparent_power
        state_class: measurement
        icon: mdi:flash-outline
        availability: "{{ is_number(states('sensor.eastron_raw_va1')) }}"
        state: "{{ states('sensor.eastron_raw_va1') | float(0) | round(1) }}"

      - name: "Scheinleistung L2"
        unique_id: eastron_va2
        unit_of_measurement: "VA"
        device_class: apparent_power
        state_class: measurement
        icon: mdi:flash-outline
        availability: "{{ is_number(states('sensor.eastron_raw_va2')) }}"
        state: "{{ states('sensor.eastron_raw_va2') | float(0) | round(1) }}"

      - name: "Scheinleistung L3"
        unique_id: eastron_va3
        unit_of_measurement: "VA"
        device_class: apparent_power
        state_class: measurement
        icon: mdi:flash-outline
        availability: "{{ is_number(states('sensor.eastron_raw_va3')) }}"
        state: "{{ states('sensor.eastron_raw_va3') | float(0) | round(1) }}"

      - name: "Scheinleistung Gesamt"
        unique_id: eastron_va_total
        unit_of_measurement: "VA"
        device_class: apparent_power
        state_class: measurement
        icon: mdi:flash-outline
        availability: "{{ is_number(states('sensor.eastron_raw_va_tot')) }}"
        state: "{{ states('sensor.eastron_raw_va_tot') | float(0) | round(1) }}"

      - name: "Leistungsfaktor L1"
        unique_id: eastron_pf1
        device_class: power_factor
        state_class: measurement
        icon: mdi:angle-acute
        availability: "{{ is_number(states('sensor.eastron_raw_pf1')) }}"
        state: "{{ states('sensor.eastron_raw_pf1') | float(0) | round(3) }}"

      - name: "Leistungsfaktor L2"
        unique_id: eastron_pf2
        device_class: power_factor
        state_class: measurement
        icon: mdi:angle-acute
        availability: "{{ is_number(states('sensor.eastron_raw_pf2')) }}"
        state: "{{ states('sensor.eastron_raw_pf2') | float(0) | round(3) }}"

      - name: "Leistungsfaktor L3"
        unique_id: eastron_pf3
        device_class: power_factor
        state_class: measurement
        icon: mdi:angle-acute
        availability: "{{ is_number(states('sensor.eastron_raw_pf3')) }}"
        state: "{{ states('sensor.eastron_raw_pf3') | float(0) | round(3) }}"

      # --- Energy (meter readings) ---
      # The phantom correction in the script already delivers cleaned, monotonic
      # values. Three decimals equal 1 Wh, matching the float32 resolution of
      # the meter registers.
      - name: "Netzbezug Gesamt"
        unique_id: eastron_energy_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-export
        availability: "{{ is_number(states('sensor.eastron_raw_e_imp')) }}"
        state: "{{ states('sensor.eastron_raw_e_imp') | float(0) | round(3) }}"

      - name: "Netzeinspeisung Gesamt"
        unique_id: eastron_energy_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-import
        availability: "{{ is_number(states('sensor.eastron_raw_e_exp')) }}"
        state: "{{ states('sensor.eastron_raw_e_exp') | float(0) | round(3) }}"

# ---------------------------------------------------------------------------
# Daily energy counters as utility_meter instead of a triggered template.
# Robust daily reset (00:00 local) and restore after restart are built in.
# entity_ids stay sensor.netzbezug_taeglich / sensor.netzeinspeisung_taeglich,
# so export and dashboard are unchanged.
#
# PLACEMENT NOTE: utility_meter is its own top-level domain. This works here
# because the file is already included with the top-level 'template:' domain
# (package / root include). If the file is instead included as a plain
# 'template: !include', the four blocks below belong in configuration.yaml
# (or a package).
# ---------------------------------------------------------------------------

utility_meter:
  netzbezug_taeglich:
    name: "Netzbezug taeglich"
    unique_id: eastron_grid_import_daily
    source: sensor.netzbezug_gesamt
    cycle: daily
    periodically_resetting: false
  netzeinspeisung_taeglich:
    name: "Netzeinspeisung taeglich"
    unique_id: eastron_grid_export_daily
    source: sensor.netzeinspeisung_gesamt
    cycle: daily
    periodically_resetting: false
