# ============================================================================
# BATTERIE LEISTUNG — Filterkette mit Bypass
#
# Kette:
#   sensor.solis_raw_batt_p                        (Rohwert aus pyscript)
#     -> sensor.batterie_leistung_gefiltert        (Ausreißer raus: percentile 50)
#         -> sensor.batterie_leistung              (final, mit 0-Bypass)
#
# Der finale Template-Sensor referenziert Roh- UND Filterwert. Geht der
# Rohwert unter 10 (Batterie idle), feuert der Rohsensor ein State-Change,
# das Template wertet sofort neu aus und gibt 0 aus — am haengenden Filter
# vorbei. Sonst wird der Filterwert ausgegeben.
#
# Alle anderen Sensoren bleiben ungefiltert.
# ============================================================================

sensor:
  - platform: statistics
    name: "Batterie Leistung gefiltert"
    unique_id: batterie_leistung_gefiltert
    entity_id: sensor.solis_raw_batt_p
    state_characteristic: percentile
    percentile: 50
    sampling_size: 5

template:
  - sensor:

      - name: "Batterie Leistung"
        unique_id: solis_batt_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:battery-charging-60
        state: >
          {% set raw = states('sensor.solis_raw_batt_p') | float(0) %}
          {% if (raw | abs) < 5 %}
            0
          {% else %}
            {{ states('sensor.batterie_leistung_gefiltert') | float(0) | round(0) }}
          {% endif %}

      - name: "Batterie Spannung"
        unique_id: solis_batt_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        state: "{{ states('sensor.solis_raw_batt_v') | float(0) }}"

      - name: "Batterie Strom"
        unique_id: solis_batt_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-dc
        state: "{{ states('sensor.solis_raw_batt_i') | float(0) }}"

      - name: "Batterie SoC"
        unique_id: solis_batt_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
#        icon: mdi:battery-medium
        state: "{{ states('sensor.solis_raw_batt_soc') | float(0) }}"

      - name: "Batterie SoH"
        unique_id: solis_batt_soh
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-heart-variant
        state: "{{ states('sensor.solis_raw_batt_soh') | float(0) }}"

      - name: "Batterie Ladung Heute"
        unique_id: solis_batt_charge_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:battery-arrow-up
        state: "{{ states('sensor.solis_raw_batt_today_charge') | float(0) }}"

      - name: "Batterie Entladung Heute"
        unique_id: solis_batt_discharge_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:battery-arrow-down
        state: "{{ states('sensor.solis_raw_batt_today_discharge') | float(0) }}"

      - name: "Batterie Ladung Gesamt"
        unique_id: solis_batt_charge_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        state: "{{ states('sensor.solis_raw_batt_total_charge') | float(0) }}"

      - name: "Batterie Entladung Gesamt"
        unique_id: solis_batt_discharge_total
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        state: "{{ states('sensor.solis_raw_batt_total_discharge') | float(0) }}"
