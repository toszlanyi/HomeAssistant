# Anschluss am RPi gpio Pin 7 & 1 (3.3V)
binary_sensor:
  - platform: rpi_gpio
    sensors:
      - port: 4 # pin 7
        name: "Gaszähler Impuls Rohsignal"
        unique_id: gas_pulse_raw
        pull_mode: "DOWN"
        invert_logic: false
        bouncetime: 200 # in milli sec

# 2. Zähler für die Impulse
counter:
  gas_counter:
    name: "Gaszähler Impulse Gesamt"
    step: 1

# 3. Wenn Impuls, dann zähle hoch
automation:
  - alias: "Gasimpuls hochzählen"
    id: gas_pulse_counter_auto
    trigger:
      - platform: state
        entity_id: binary_sensor.gaszahler_impuls_rohsignal
        from: "off"
        to: "on"
    action:
      - service: counter.increment
        target:
          entity_id: counter.gas_counter

# 4. Umrechnung in m³ für das Dashboard
template:
  - sensor:
      - name: "Gaszähler"
        unit_of_measurement: "m³"
        device_class: gas
        state_class: total_increasing
        unique_id: gas_meter_m3
        state: >
          {% set basis = 7625.60 %}
          {% set impulse = states('counter.gas_counter') | float(0) %}
          {{ (basis + (impulse * 0.01)) | round(2) }}
