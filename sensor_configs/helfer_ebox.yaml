# =============================================================================
# eBox Smart – Cumulative Energy Meter (Firmware 3.0.4+)
# =============================================================================
# CONCEPT
#   Total meter = anchor + register
#
#   'anchor'   – absolute meter reading at the last cable connect
#                (the value when register was last reset to 0)
#   'register' – energy delivered since that connect, accumulates across
#                consecutive sessions as long as the cable stays plugged in,
#                resets to 0 only when charging begins.
#
#   (A) register < 0.2  ->  cable connected / charging starts / register zeroed
#                           anchor = start
#
#   (B) session > 0.05  ->  parked after charging
#                           anchor = start + session - register
#                           (self-healing / bootstrap)
#
#   (C) otherwise       ->  active charging session, anchor unchanged
#                           (frozen value carried forward via own attribute)
#
#   (D) rule C but no stored anchor  ->  state genuinely unknown, HOLD.
# =============================================================================

template:
  - trigger:
      - platform: state
        entity_id:
          - sensor.ebox_smart_energy_active_import_register
          - sensor.ebox_smart_energy_session
          - sensor.ebox_smart_energy_meter_start
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    variables:
      reg: "{{ states('sensor.ebox_smart_energy_active_import_register') | float(0) }}"
      st: "{{ states('sensor.ebox_smart_energy_meter_start') | float(0) }}"
      se: "{{ states('sensor.ebox_smart_energy_session') | float(0) }}"
    sensor:
      - name: "eBox Energie kumuliert"
        unique_id: ebox_energy_cumulative
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        # All three inputs are used in the maths, so all three are required
        # here. Leaving 'session' out let a missing state become 0.0.
        availability: >-
          {{ is_number(states('sensor.ebox_smart_energy_active_import_register'))
             and is_number(states('sensor.ebox_smart_energy_meter_start'))
             and is_number(states('sensor.ebox_smart_energy_session')) }}
        state: >-
          {% set prev_anchor = this.attributes.get('anchor', none) if this is defined else none %}
          {% set prev_state = this.state if this is defined else none %}
          {% if reg < 0.2 %}
            {% set anchor = st %}
          {% elif se > 0.05 %}
            {% set anchor = st + se - reg %}
          {% elif is_number(prev_anchor) %}
            {% set anchor = prev_anchor | float %}
          {% else %}
            {% set anchor = none %}
          {% endif %}
          {% if anchor is none %}
            {# No rule applies and no stored anchor: hold, never guess. #}
            {{ prev_state if is_number(prev_state) else 'unknown' }}
          {% else %}
            {% set raw = anchor + reg %}
            {# total_increasing: the reading cannot physically fall. #}
            {{ ([raw, prev_state | float(raw)] | max) | round(2, 'floor') }}
          {% endif %}
        attributes:
          # Same decision tree as 'state'. It has to be repeated because the
          # state template is rendered BEFORE the attributes and therefore
          # still sees the previous attribute values.
          anchor: >-
            {% set prev_anchor = this.attributes.get('anchor', none) if this is defined else none %}
            {% if reg < 0.2 %}
              {{ st | round(3) }}
            {% elif se > 0.05 %}
              {{ (st + se - reg) | round(3) }}
            {% elif is_number(prev_anchor) %}
              {{ prev_anchor | float | round(3) }}
            {% else %}
              {{ '' }}
            {% endif %}
          # Diagnostic: which branch produced the current value.
          #   A / B / frozen -> normal operation
          #   hold           -> inputs inconsistent, previous value kept
          #   clamped        -> monotonic guard engaged (investigate if seen)
          anchor_rule: >-
            {% set prev_anchor = this.attributes.get('anchor', none) if this is defined else none %}
            {% set prev_state = this.state if this is defined else none %}
            {% if reg < 0.2 %}
              {% set anchor = st %}{% set rule = 'A' %}
            {% elif se > 0.05 %}
              {% set anchor = st + se - reg %}{% set rule = 'B' %}
            {% elif is_number(prev_anchor) %}
              {% set anchor = prev_anchor | float %}{% set rule = 'frozen' %}
            {% else %}
              {% set anchor = none %}{% set rule = 'hold' %}
            {% endif %}
            {% if anchor is none %}
              hold
            {% elif is_number(prev_state) and (anchor + reg) < (prev_state | float) %}
              clamped
            {% else %}
              {{ rule }}
            {% endif %}
          last_updated: "{{ now().isoformat() }}"


# =============================================================================
# Additional charged percentage of the Hyundai Ioniq 5.
# Not the car SoC, but the differential charge derived from the energy and time
# the car has been charging.
#   capacity - usable battery size (77 kWh)
#   base     - standby draw of the car electronics while charging (0.1 kWh/h)
#   conv     - AC-DC and battery losses (90 %)
# =============================================================================

  - trigger:
      - platform: state
        entity_id: sensor.ebox_smart_status_connector
      - platform: state
        entity_id: sensor.ebox_smart_energy_active_import_register
      - platform: state
        entity_id: sensor.ebox_smart_time_session
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    variables:
      status: "{{ states('sensor.ebox_smart_status_connector') }}"
      reg: "{{ states('sensor.ebox_smart_energy_active_import_register') | float(0) }}"
      tim: "{{ states('sensor.ebox_smart_time_session') | float(0) }}"
    sensor:
      - name: "Bis jetzt geladen (SOC)"
        unique_id: car_session_charge_percentage
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-charging
        availability: >-
          {{ is_number(states('sensor.ebox_smart_energy_active_import_register'))
             and is_number(states('sensor.ebox_smart_time_session')) }}
        state: >-
          {% set capacity = 77 %}
          {% set base = 0.1 %}
          {% set conv = 90 %}
          {% set was_hold = this.attributes.get('hold', false) | bool if this is defined else false %}
          {% set time_offset = this.attributes.get('time_offset', 0) | float(0) if this is defined else 0 %}
          {% set last_time = this.attributes.get('last_time', tim) | float(tim) if this is defined else tim %}
          {# hold: 0 % from a real plug-in (Preparing) until the eBox has
             zeroed the register for the new plug-in. #}
          {% if status == 'Preparing' %}
            {% set hold = true %}
          {% elif reg < 0.2 %}
            {% set hold = false %}
          {% else %}
            {% set hold = was_hold %}
          {% endif %}
          {# time_offset: register accumulates across consecutive sessions on
             one plug-in, but time_session resets to 0 at every charge start.
             To keep the base loss (base * hours) in step with the cumulative
             register, carry the pre-reset session time forward. #}
          {% if reg < 0.2 %}
            {% set time_offset = 0 %}
          {% elif tim < last_time %}
            {% set time_offset = time_offset + last_time %}
          {% endif %}
          {% set eff_h = (time_offset + tim) / 60 %}
          {% if hold %}
            0
          {% elif reg > base * eff_h %}
            {{ ((reg - base * eff_h) / capacity * conv) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          hold: >-
            {% set was_hold = this.attributes.get('hold', false) | bool if this is defined else false %}
            {% if status == 'Preparing' %}
              {{ true }}
            {% elif reg < 0.2 %}
              {{ false }}
            {% else %}
              {{ was_hold }}
            {% endif %}
          time_offset: >-
            {% set time_offset = this.attributes.get('time_offset', 0) | float(0) if this is defined else 0 %}
            {% set last_time = this.attributes.get('last_time', tim) | float(tim) if this is defined else tim %}
            {% if reg < 0.2 %}
              {{ 0 }}
            {% elif tim < last_time %}
              {{ time_offset + last_time }}
            {% else %}
              {{ time_offset }}
            {% endif %}
          last_time: "{{ tim }}"


# =============================================================================
# German label for the OCPP connector status ("Happy wife, happy life").
# =============================================================================

  - sensor:
      - name: "eBox Smart Connector Status (DE)"
        unique_id: ebox_status_connector_de
        icon: mdi:ev-station
        state: >
          {% set quelle = 'sensor.ebox_smart_status_connector' %}
          {% set s = states(quelle) | lower %}
          {% if s == 'charging' %}
            {% set mins = states('sensor.ebox_smart_time_session') | int(0) %}
            {% set h = (mins // 60) %}
            {% set m = (mins % 60) %}
            Lädt (seit {% if h > 0 %}{{ '%02d'|format(h) }}h {% endif %}{{ '%02d'|format(m) }}min)
          {% else %}
            {% set m = {
              'available': 'Verfügbar',
              'preparing': 'Vorbereitung (Kabel steckt)',
              'suspendedev': 'Pausiert (Fahrzeug)',
              'suspendedevse': 'Pausiert (Ladestation)',
              'finishing': 'Fertig (Ladekabel steckt)',
              'reserved': 'Reserviert',
              'unavailable': 'Nicht verfügbar',
              'faulted': 'Fehler',
              'occupied': 'Belegt'
            } %}
            {{ m.get(s, states(quelle)) }}
          {% endif %}
        availability: >
          {{ states('sensor.ebox_smart_status_connector') not in ['unknown', 'unavailable'] }}
        attributes:
          original_status: "{{ states('sensor.ebox_smart_status_connector') }}"
