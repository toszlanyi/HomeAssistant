# =============================================================================
# eBox Smart – Gesamt-Energiezaehler (Firmware 3.0.4+)
# =============================================================================
# Ablage:  config/sensor_configs/ebox_energy_meter.yaml
# Eingebunden via:  homeassistant: packages: !include_dir_named sensor_configs
#
# ERSETZT die bisherige pyscript-Loesung vollstaendig.
#
# MIGRATION (Historie bleibt erhalten):
#   - name + unique_id sind IDENTISCH zum alten Dashboard-Sensor
#     ("eBox Energie kumuliert" / ebox_energy_cumulative), daher behaelt
#     sensor.ebox_energie_kumuliert seine entity_id UND seine Historie.
#   - Vor dem Neuladen entfernen:
#       * pyscript-Datei  ebox_energy_meter.py
#       * die beiden input_number  (ebox_cumulative_energy, ebox_register_offset)
#       * die alten Template-Sensoren in dieser Datei (durch diese Version ersetzt)
#   - Die raw-Sensoren (sensor.ebox_energy_cumulative_raw usw.) verschwinden
#     mit pyscript; werden hier nicht mehr gebraucht (Wert wird selbst berechnet).
#
# KONZEPT
#   Gesamtzaehler = anchor + register
#   'anchor' = absoluter Zaehlerstand beim letzten Kabel-Connect (Stand, als
#   register zuletzt 0 war). 'register' liefert den Zuwachs seit dem Connect –
#   ueber beliebig viele Folge-Sessions hinweg.
#
# ANKER-REGELN (gegen echte eBox-Zaehlerstaende verifiziert: 0 Rueckspruenge,
#               max. 4 Wh Abweichung, Endstand exakt = Web-Interface 872,16):
#   (A) register < 0.2  -> Kabel frisch gesteckt / Zaehler genullt
#                          -> anchor = start
#   (B) session > 0.05  -> geparkt nach dem Laden
#                          -> anchor = start + session - register
#                          (Selbstheilung + Bootstrap; nur Backup, normal
#                          laeuft alles ueber Regel A)
#   sonst (laufende Session) -> anchor eingefroren
# =============================================================================

template:
  - trigger:
      - platform: state
        entity_id:
          - sensor.ebox_smart_energy_active_import_register
          - sensor.ebox_smart_energy_session
      - platform: homeassistant
        event: start
    variables:
      reg: "{{ states('sensor.ebox_smart_energy_active_import_register') | float(0) }}"
      st:  "{{ states('sensor.ebox_smart_energy_meter_start') | float(0) }}"
      se:  "{{ states('sensor.ebox_smart_energy_session') | float(0) }}"
      prev_anchor: "{{ this.attributes.get('anchor', st + se - reg) | float(st + se - reg) }}"
      new_anchor: >-
        {% if reg < 0.2 %}
          {{ st }}
        {% elif se > 0.05 %}
          {{ st + se - reg }}
        {% else %}
          {{ prev_anchor }}
        {% endif %}
    sensor:
      # WICHTIG: name + unique_id identisch zum alten Sensor -> Historie bleibt
      - name: "eBox Energie kumuliert"
        unique_id: ebox_energy_cumulative
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        availability: >-
          {{ states('sensor.ebox_smart_energy_active_import_register')
             not in ['unavailable','unknown','none', none]
             and states('sensor.ebox_smart_energy_meter_start')
             not in ['unavailable','unknown','none', none] }}
        state: "{{ (new_anchor | float(0) + reg) | round(3) }}"
        attributes:
          anchor: "{{ new_anchor | float(0) | round(3) }}"
          last_updated: "{{ now().isoformat() }}"
