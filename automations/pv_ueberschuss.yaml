# =============================================================================
# PV Surplus Charging – eBox Automation - USE WITH ebox.py ChargePoint override
# =============================================================================
#
# File:    config/automations/pv_ueberschuss.yaml
# Version: 4.11
#
# -----------------------------------------------------------------------------
# DESIGN PHILOSOPHY
# -----------------------------------------------------------------------------
#
# Car charging only happens when PV surplus is available.
# The battery acts as a buffer, not as a car charger.
# The goal is maximum hardware longevity (contactor, battery cycles)
# while still delivering meaningful charge energy to the car each sunny day.
#
# Power path:  PV → Inverter → House AC bus → eBox → Car (3-phase AC)
#              House battery also connects to AC bus via inverter.
#              The car receives AC only – no DC path to house battery.
#              Car's 12V system is powered by its own traction battery
#              via an internal DC/DC converter (independent of house SOC).
#
# -----------------------------------------------------------------------------
# CONTROL LOGIC OVERVIEW
# -----------------------------------------------------------------------------
#
# MUST PAUSE (immediate stop / keep stopped):
#   - SOC below hard minimum            → protect house battery
#   - Forecast below safety threshold   → reserve energy for the night
#   - Solar elevation ≤ 0°             → absolute darkness (night)
#   - Car charged to target value
#
# CAN START (restart allowed only if ALL conditions true):
#   - Solar elevation > 25°            → enough sun for useful PV
#   - SOC recovered above restart level → house battery buffer available
#   - Forecast above threshold + hysteresis → no immediate re-stop
#   - Surplus current sufficient or house battery full
#
# PAUSE / RESTART MECHANISM (IEC 61851 + OCPP 1.6J):
#
#   PAUSE (must_pause fires):
#     ebox.py handles soft stop (0A) -> contactor opens (immediate).
#     OCPP session stays active (SuspendedEVSE, no StopTransaction yet).
#     Car (Ioniq 5) stays awake in State B; restart-lock timer starts.
#
#   MANDATORY OFF TIME (timer.ebox_sleep_protection):
#     While the timer is active, charging is NOT resumed even if
#     must_pause becomes false. This guarantees a minimum contactor
#     dwell time and prevents rapid opening/closing cycles.
#
#   SHORT PAUSE – timer expires, conditions recovered:
#     Block II detects SuspendedEVSE (or Charging) → sets target_amps →
#     State B→C → contactor closes. Seamless resume, one extra contactor
#     cycle.
#
#   LONG PAUSE / EVENING – timer expires, must_pause still True:
#     Next tick: Block I Zweig C detects SuspendedEVSE + timer idle →
#     turn_off (StopTransaction). Car enters deep sleep → minimal 12V drain.
#     Next morning: cold start via Block II DEFAULT when conditions met.
#
#   CC turn_on / turn_off:
#     turn_on  = StartTransaction (new session + authorisation, cold start only)
#     turn_off = StopTransaction  (session ends, car may enter deep sleep)
#
# PROTECTION:
#   - turn_on  only when CC = "off"
#   - turn_off only when CC = "on"
#   → prevents OCPP transaction rejects
#
# -----------------------------------------------------------------------------
# CONNECTOR STATUS (sensor.ebox_smart_status_connector):
#   Available     – no car connected
#   Preparing     – cable connected, session not yet started
#   Charging      – actively charging
#   SuspendedEV   – session active, car paused
#   SuspendedEVSE – session active, EVSE paused (0 A set by automation)
#   Finishing     – session ending
#   Unavailable   – wallbox offline
#   Faulted       – hardware fault
#
# -----------------------------------------------------------------------------
# SURPLUS CURRENT SENSOR:
#   sensor.pv_strom_uberschuss_mit_glattung
#   = (DC_power − Inverter_losses − (house_consumption - wallbox_AC)) / (3 × V_avg)
# =============================================================================

- id: pv_ueberschuss_hauptsteuerung
  alias: "PV Überschuss Laden"
  description: >
    Minute-by-minute charge current control based on PV surplus,
    battery SOC, solar forecast and solar elevation.
  mode: single
  max_exceeded: silent

  trigger:
    - platform: time_pattern
      minutes: "/1"

  condition:
    - condition: state
      entity_id: input_boolean.pv_uberschussladen
      state: "on"

  action:
    - variables:

        # =====================================================================
        # TUNING PARAMETERS
        # =====================================================================

        # --- House battery protection ---
        min_soc_limit: 40           # % SOC – hard stop below this
        start_soc_offset: 30        # % SOC – restart above (min + offset) = 70 %
        soc_battery_full: 90        # % SOC – override min_amps_start when full

        # --- Solar forecast safety ---
        solar_safety_factor: 1.8    # × remaining battery capacity = min forecast
        forecast_buffer_kwh: 3    # kWh – extra headroom for restart hysteresis

        # --- Surplus current ---
        min_amps_start: 6.5         # A – minimum surplus required to restart

        # --- Solar elevation thresholds ---
        # Two independent levels:
        #   - night_threshold : below this it is physically dark; hard stop.
        #   - min_elevation   : minimum elevation to allow a (re)start.
        #                       Charging, once started, may continue below
        #                       this value as long as night_threshold and
        #                       other must_pause conditions are not met.
        night_threshold: 0          # degrees – hard stop when elevation ≤ 0°
        min_elevation: 20           # degrees – restart block below this

        # =====================================================================
        # RUNTIME CALCULATIONS
        # =====================================================================

        charge_threshold: >
          {{ states('input_number.ladegrenze') | float(30) }}
        charge_status: >
          {{ states('sensor.auto_ladesession_soc') | float(0) }}
        soc: >
          {{ states('sensor.batterie_soc') | float(0) }}
        solar_remaining: >
          {{ states('sensor.solar_vorhersage_heute_verbleibend') | float(0) }}
        raw_amps: >
          {{ states('sensor.pv_strom_uberschuss_mit_glattung') | float(0) }}
        current_offered: >
          {{ states('sensor.ebox_smart_current_offered') | float(0) }}

        batt_remaining_kwh: >
          {{ ((100 - soc) / 100 * 10) | round(2) }}
        solar_threshold: >
          {{ (batt_remaining_kwh * solar_safety_factor) | round(2) }}

        sun_elevation: >
          {{ states('sensor.sun_solar_elevation') | float(0) }}

        connector_status: >
          {{ states('sensor.ebox_smart_status_connector') }}

        # --- Decision flags ---

        must_pause: >
          {{ soc < min_soc_limit
             or charge_status >= charge_threshold
             or solar_remaining < solar_threshold
             or sun_elevation <= night_threshold }}

        can_start: >
          {{ sun_elevation > min_elevation
             and charge_status < charge_threshold
             and soc >= (min_soc_limit + start_soc_offset)
             and (raw_amps >= min_amps_start or soc >= soc_battery_full)
             and solar_remaining >= (solar_threshold + forecast_buffer_kwh) }}

        # Round UP above restart threshold → battery buffered, favour car.
        # Round DOWN below (threshold - 10)→ house battery priority.
        round_up: >
          {% set soc_val = states('sensor.batterie_soc') | float(0) %}
          {% if soc_val > (min_soc_limit + start_soc_offset) %}
            {{ true }}
          {% elif soc_val < (min_soc_limit + start_soc_offset - 10) %}
            {{ false }}
          {% else %}
            {{ is_state('input_boolean.pv_runden_aufrunden', 'on') }}
          {% endif %}

        # Max current 14A for a 10kW inverter -> no power from grid wanted,
        # in case of false sensor information or race condition
        # rounding up adds 1A to ensure battery discharge
        # rounding down subtracts 1A to ensure battery charges
        target_amps: >
          {% if round_up | bool %}
            {{ [[(raw_amps + 1) | round(0, 'ceil') | int, 6] | max, 14] | min }}
          {% else %}
            {{ [[(raw_amps - 1) | int, 6] | max, 14] | min }}
          {% endif %}

    - service: "input_boolean.{{ 'turn_on' if round_up | bool else 'turn_off' }}"
      target:
        entity_id: input_boolean.pv_runden_aufrunden

    - choose:

        # =====================================================================
        # BLOCK I – MUST PAUSE
        # Triggered by: low SOC / insufficient forecast / complete darkness
        # =====================================================================
        - conditions:
            - condition: template
              value_template: "{{ must_pause }}"
          sequence:
            - choose:

                # -----------------------------------------------------------------
                # Branch A: Car unplugged while paused – turn off immediately.
                # -----------------------------------------------------------------
                - conditions:
                    - condition: state
                      entity_id: switch.ebox_smart_charge_control
                      state: "on"
                    - condition: template
                      value_template: "{{ connector_status == 'Available' }}"
                  sequence:
                    - service: timer.cancel
                      target:
                        entity_id: timer.ebox_sleep_protection
                    - service: switch.turn_off
                      target:
                        entity_id: switch.ebox_smart_charge_control
                    - service: logbook.log
                      data:
                        name: "eBox aus (Auto getrennt) –> "
                        entity_id: input_button.pv_uberschuss_log
                        message: >
                          Auto während Pause abgesteckt. StopTransaction ausgelöst.

                # -----------------------------------------------------------------
                # Branch B: Restart-lock timer is running → wait it out.
                # -----------------------------------------------------------------
                - conditions:
                    - condition: state
                      entity_id: timer.ebox_sleep_protection
                      state: "active"
                  sequence: []

                # -----------------------------------------------------------------
                # Branch C: CC on and session active → pause.
                # Covers Charging, SuspendedEV (car-side pause) and Finishing.
                # Set 0 A: CP-Pilot duty 0 % → IEC 61851 State C→B → contactor opens.
                # OCPP session stays active (SuspendedEVSE, no StopTransaction yet).
                # Restart-lock timer starts. Decision to stop session is deferred:
                #   - if conditions recover before timer expires → Block II resumes
                #   - if timer expires and must_pause still True → Branch C stops session
                # -----------------------------------------------------------------
                - conditions:
                    - condition: state
                      entity_id: switch.ebox_smart_charge_control
                      state: "on"
                    - condition: template
                      value_template: "{{ connector_status in ['Charging', 'Finishing'] }}"
                  sequence:
                    - service: number.set_value
                      target:
                        entity_id: number.ebox_smart_maximum_current
                      data:
                        value: 0
                    - service: timer.start
                      target:
                        entity_id: timer.ebox_sleep_protection
                    - service: logbook.log
                      data:
                        name: "Pause (0 A) –> "
                        entity_id: input_button.pv_uberschuss_log
                        message: >
                          {% if soc < min_soc_limit %}
                            SOC {{ soc | round(1) }}% – unter dem absoluten Minimum von {{ min_soc_limit }}%
                          {% elif sun_elevation <= night_threshold %}
                            Sonne unter {{ night_threshold }}° (Nacht)
                          {% elif charge_status >= charge_threshold %}
                            Auto fertig geladen (Ladegrenze von {{ charge_status }}% erreicht)
                          {% else %}
                            PV Vorhersage {{ solar_remaining }} kWh unter Sicherheitsgrenze {{ solar_threshold }} kWh
                            (Batterie {{ batt_remaining_kwh }} kWh × {{ solar_safety_factor }})
                          {% endif %}

                # -----------------------------------------------------------------
                # Branch D: CC on, session paused (SuspendedEVSE), timer idle.
                # The restart-lock timer has expired and conditions are still not met.
                # Send StopTransaction → car enters deep sleep → minimal 12V drain.
                # connector_status='SuspendedEVSE' is used instead of current_offered=0
                # to guard against OCPP sensor unavailability (float(0) false positive).
                # -----------------------------------------------------------------
                - conditions:
                    - condition: state
                      entity_id: switch.ebox_smart_charge_control
                      state: "on"
                    - condition: template
                      value_template: "{{ connector_status == 'SuspendedEVSE' }}"
                    - condition: state
                      entity_id: timer.ebox_sleep_protection
                      state: "idle"
                  sequence:
                    - service: switch.turn_off
                      target:
                        entity_id: switch.ebox_smart_charge_control
                    - service: logbook.log
                      data:
                        name: "eBox ausgeschaltet –> "
                        entity_id: input_button.pv_uberschuss_log
                        message: >
                          Restart-Sperre abgelaufen, Bedingungen weiterhin nicht erfüllt.
                          StopTransaction – Auto geht in Deep-Sleep.
                          {% if soc < min_soc_limit %}
                            Ursache: SOC {{ soc | round(1) }}% unter {{ min_soc_limit }}%
                          {% elif sun_elevation <= night_threshold %}
                            Ursache: Sonne unter {{ night_threshold }}° (Nacht)
                          {% else %}
                            Ursache: PV Vorhersage {{ solar_remaining }} kWh < {{ solar_threshold }} kWh
                          {% endif %}

        # =====================================================================
        # BLOCK II – NORMAL OPERATION / RESTART
        # Reached only when must_pause is FALSE.
        # =====================================================================
      default:
        - choose:

            # -----------------------------------------------------------------
            # Branch A: Car unplugged while charging (must_pause = false).
            # If the car was disconnected during an active session, turn off CC
            # immediately to avoid a stuck ON state.
            # -----------------------------------------------------------------
            - conditions:
                - condition: state
                  entity_id: switch.ebox_smart_charge_control
                  state: "on"
                - condition: template
                  value_template: "{{ connector_status in ['Available'] }}"
              sequence:
                - service: timer.cancel
                  target:
                    entity_id: timer.ebox_sleep_protection
                - service: switch.turn_off
                  target:
                    entity_id: switch.ebox_smart_charge_control
                - service: logbook.log
                  data:
                    name: "eBox aus (Auto getrennt) –> "
                    entity_id: input_button.pv_uberschuss_log
                    message: >
                      Aktive Ladung von extern (App / Auto) gestoppt.

            # -----------------------------------------------------------------
            # Branch B: Mandatory contactor OFF time.
            # As long as the sleep protection timer is active, do absolutely
            # nothing – even if must_pause is already false.
            # -----------------------------------------------------------------
            - conditions:
                - condition: state
                  entity_id: timer.ebox_sleep_protection
                  state: "active"
              sequence: []

            # -----------------------------------------------------------------
            # Branch C: FULL RESTART ALLOWED (can_start True).
            # Cold start if CC off, or adjust current if already charging.
            # -----------------------------------------------------------------
            - conditions:
                - condition: template
                  value_template: "{{ can_start }}"
              sequence:
                - service: timer.cancel
                  target:
                    entity_id: timer.ebox_sleep_protection

                # Cold start: CC off → StartTransaction (new OCPP session) 
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: switch.ebox_smart_charge_control
                          state: "off"
                        - condition: template
                          value_template: "{{ connector_status in ['Preparing', 'SuspendedEVSE', 'Finishing'] }}"
                      sequence:
                        - service: number.set_value
                          target:
                            entity_id: number.ebox_smart_maximum_current
                          data:
                            value: "{{ target_amps }}" 
                        - service: switch.turn_on
                          target:
                            entity_id: switch.ebox_smart_charge_control
                        - service: logbook.log
                          data:
                            name: "eBox eingeschaltet –> "
                            entity_id: input_button.pv_uberschuss_log
                            message: >
                              PV Überschuss {{ raw_amps | round(2) }} A,
                              SOC {{ soc | round(1) }}%,
                              PV Vorhersage {{ solar_remaining }} kWh
                              (Grenzwert {{ solar_threshold }} kWh + Puffer {{ forecast_buffer_kwh }} kWh)

                # Set charge current
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: switch.ebox_smart_charge_control 
                          state: "on"
                        - condition: template
                          value_template: >
                            {{ target_amps != current_offered
                               and connector_status in ['Charging','SuspendedEVSE'] }}
                      sequence:
                        - service: number.set_value
                          target:
                            entity_id: number.ebox_smart_maximum_current
                          data:
                            value: "{{ target_amps }}"
                        - service: logbook.log
                          data:
                            name: "Setze Ladestrom -> "
                            entity_id: input_button.pv_uberschuss_log
                            message: >
                              Strom: {{ target_amps }} A
                              (PV Überschuss: {{ raw_amps | round(1) }} A,
                              SOC: {{ soc | round(0) }} %)

            # -----------------------------------------------------------------
            # BLOCK III - RUNNING SESSION, can_start = False.
            # must_pause is false, so if the car is still in a charging session
            # (Charging, SuspendedEVSE or Finishing) we may continue delivering
            # current. This explicitly does NOT start a new session; it only
            # keeps an existing one alive even though a fresh start would be
            # blocked.
            # -----------------------------------------------------------------
            - conditions:
                - condition: template
                  value_template: "{{ not can_start }}"
                - condition: state
                  entity_id: switch.ebox_smart_charge_control
                  state: "on"
                - condition: template
                  value_template: >
                            {{ target_amps != current_offered
                               and connector_status == 'Charging' }} 
              sequence:
                - service: number.set_value
                  target:
                    entity_id: number.ebox_smart_maximum_current
                  data:
                    value: "{{ target_amps }}"
                - service: logbook.log
                  data:
                    name: "Ladesession fortgesetzt -> "
                    entity_id: input_button.pv_uberschuss_log
                    message: >
                      Strom: {{ target_amps }} A (Session aktiv, PV Überschuss {{ raw_amps | round(1) }} A,
                      SOC {{ soc | round(0) }}%)

            # -----------------------------------------------------------------
            # DEFAULT: No start allowed (CC off or status not ready).
            # Simply wait without action.
            # -----------------------------------------------------------------
          default: []

# =============================================================================
# SPECIAL CASE - CAR FINISHED – car stopped charging (Charging → SuspendedEV).
# The car says "stop" – either its own target SOC was reached or charging was
# stopped remotely (e.g. Bluelink app). End the session and disable surplus
# mode so the cold-start logic cannot restart a finished car.
# =============================================================================
- id: pv_ueberschuss_auto_voll
  alias: "PV Überschuss – Auto voll (Charging → SuspendedEV)"
  description: >
    Ends the session and disables surplus mode when the car stops charging
    on its own (target SOC reached or remote stop). Boolean is switched off
    BEFORE CC to close the cold-start race window. 15 s debounce guards
    against brief car-side pauses.
  mode: single

  trigger:
    - platform: state
      entity_id: sensor.ebox_smart_status_connector
      from: "Charging"
      to: "SuspendedEV"

  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.pv_uberschussladen
          state: "on"
        - condition: state
          entity_id: switch.ebox_smart_charge_control
          state: "on"

  action:
    # Debounce: give the car 15 s to resume on its own.
    - delay:
        seconds: 30
    # Another check, if the car resumed charging (or main automation paused to 0 A,
    # status then SuspendedEVSE) during the debounce window.
    - condition: state
      entity_id: sensor.ebox_smart_status_connector
      state: "SuspendedEV"
    # STEP 1 – surplus mode off FIRST (closes the cold-start race window;
    # also triggers MODE DEACTIVATED: timer cancel + its log entry).
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.pv_uberschussladen
              state: "on"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.pv_uberschussladen
    # STEP 2 – end the OCPP session (only if CC is actually on).
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.ebox_smart_charge_control
              state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.ebox_smart_charge_control
    - service: logbook.log
      data:
        name: "eBox aus (Auto voll) –> "
        entity_id: input_button.pv_uberschuss_log
        message: >
          Fahrzeug hat Ladevorgang selbst beendet (Charging → SuspendedEV,
          30 s stabil). PV-Überschussmodus deaktiviert, Session beendet –
          weiteres Laden wird verhindert.

# =============================================================================
# MODE ACTIVATED – log entry
# =============================================================================
- id: pv_ueberschuss_aktiviert
  alias: "PV Überschuss – Modus aktiviert"
  description: >
    Logs a single entry when surplus charging mode is switched on manually.
  mode: single

  trigger:
    - platform: state
      entity_id: input_boolean.pv_uberschussladen
      to: "on"

  action:
    - service: logbook.log
      data:
        name: "PV Überschuss aktiviert -> "
        entity_id: input_button.pv_uberschuss_log
        message: >
          PV Überschuss: {{ states('sensor.pv_strom_uberschuss_mit_glattung') | float(0) | round(1) }} A,
          SOC: {{ states('sensor.batterie_soc') | float(0) | round(0) }} %

# =============================================================================
# MODE DEACTIVATED – clean up
# Sets 0 A first (contactor opens via IEC 61851 State C→B),
# then CC turn_off (StopTransaction). Timer cancelled.
# =============================================================================
- id: pv_ueberschuss_deaktiviert
  alias: "PV Überschuss – Modus deaktiviert"
  description: >
    Cleans up when surplus charging mode is switched off manually.
    Sets 0 A first (contactor opens), then StopTransaction. Timer cancelled.
  mode: single

  trigger:
    - platform: state
      entity_id: input_boolean.pv_uberschussladen
      to: "off"

  action:
    - service: timer.cancel
      target:
        entity_id: timer.ebox_sleep_protection
    - service: logbook.log
      data:
        name: "PV Überschuss deaktiviert -> "
        entity_id: input_button.pv_uberschuss_log
        message: >
          Automatik aus, Timer gestoppt. CC-Schalter unverändert.
          
# =============================================================================
# Counts CC on/off events. Reset daily at midnight.
# =============================================================================

- id: ebox_cc_zaehler_einschalten
  alias: "eBox CC – Einschaltvorgang zählen"
  trigger:
    - platform: state
      entity_id: switch.ebox_smart_charge_control
      to: "on"
  action:
    - service: counter.increment
      target:
        entity_id: counter.ebox_cc_einschaltvorgaenge

- id: ebox_cc_zaehler_ausschalten
  alias: "eBox CC – Ausschaltvorgang zählen"
  trigger:
    - platform: state
      entity_id: switch.ebox_smart_charge_control
      from: "on"
      to: "off"
  action:
    - service: counter.increment
      target:
        entity_id: counter.ebox_cc_ausschaltvorgaenge

- id: ebox_cc_zaehler_reset
  alias: "eBox CC – Zähler Tagesreset"
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - service: counter.reset
      target:
        entity_id: counter.ebox_cc_einschaltvorgaenge
    - service: counter.reset
      target:
        entity_id: counter.ebox_cc_ausschaltvorgaenge
