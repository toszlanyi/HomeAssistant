
# Loads default set of integrations. Do not remove.
default_config:

script: !include scripts.yaml
scene: !include scenes.yaml

automation: !include_dir_merge_list automations/

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  packages: !include_dir_named sensor_configs # (für separate YAML Dateien)

command_line:
  - sensor:

#     Größe der Datenbank Datei
      name: "HA Datenbank Groesse"
      # Der Pfad zur SQLite Datei im Standard-Config-Ordner
      command: "du -m /config/home-assistant_v2.db | cut -f1"
      unit_of_measurement: "MB"
      value_template: "{{ value | int }}"
      scan_interval: 1800 # Zweimal pro Stunde prüfen reicht
      unique_id: "ha_db_size_mb"
      icon: mdi:database-check

recorder:
  commit_interval: 60 # nur alle x Sekunden in Datenbank schreiben
  purge_keep_days: 10  # alte Daten löschen
  exclude:
    entity_globs:
      # --- Eastron: Roh-Quellschicht vom Pyscript (Werte liegen in den Templates) ---
      - sensor.eastron_raw_*
      - sensor.eastron_10min_*
      # --- Solis: Roh-Quellschicht vom Pyscript (Werte liegen in den Templates) ---
      - sensor.solis_raw_*
      # --- Filterketten: Median/Percentile-Zwischenstufen nicht in DB schreiben.
      #     Die _mit_glattung-Mittelwerte bleiben aufgezeichnet. ---
      - sensor.*_gefiltert
    entities:
      - sensor.pv_leistung_netto
      - sensor.pv_strom_uberschuss
      - sensor.wr_leistung
      - sensor.haus_ohne_wallbox

# Log Level
logger:
  default: warning
  logs:
    custom_components.pyscript: info
    custom_components.ocpp: info
